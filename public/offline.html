<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f26037" />
    <title>오프라인 · 덤핑몰</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafbfc;
        color: #27322e;
        font-family: system-ui, sans-serif;
        padding: 28px;
        text-align: center;
      }
      main {
        max-width: 440px;
      }
      img {
        width: 68px;
        border-radius: 16px;
      }
      h1 {
        font-size: 26px;
        margin: 28px 0 15px;
        letter-spacing: -1px;
      }
      p {
        font-size: 16px;
        line-height: 1.8;
        color: #6c7771;
      }
      a {
        display: inline-block;
        background: #f26037;
        color: #fff;
        padding: 14px 27px;
        border-radius: 8px;
        text-decoration: none;
        margin-top: 20px;
        font-weight: 600;
      }
      small {
        display: block;
        margin-top: 27px;
        color: #929b96;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="덤핑몰" />
      <h1>잠시 연결이 끊겼어요</h1>
      <p>
        인터넷에 다시 연결하면<br />좋은 재고를 계속 찾아볼 수 있어요.<br />저장한
        견적과 관심상품은 계정에 남아 있습니다.
      </p>
      <a href="/">다시 연결하기</a
      ><small>재고·가격·거래 정보는 온라인에서 확인해 주세요.</small>
    </main>
  </body>
</html>
